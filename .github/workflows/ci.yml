name: Verify release
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13.17', '3.14.7']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE_DATE_EPOCH: '315532800'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create a clean tool environment
        shell: pwsh
        run: |
          $toolEnvironment = Join-Path $env:RUNNER_TEMP 'm3u-tools-${{ matrix.python-version }}'
          python -m venv $toolEnvironment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VIRTUAL_ENV=$toolEnvironment" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $toolEnvironment 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "M3U_CONFIG_DIR=$(Join-Path $env:RUNNER_TEMP 'm3u-config-${{ matrix.python-version }}')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "M3U_STATE_DIR=$(Join-Path $env:RUNNER_TEMP 'm3u-state-${{ matrix.python-version }}')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked test and build tools
        run: >-
          python -m pip --isolated --disable-pip-version-check install
          --index-url https://pypi.org/simple --require-hashes --only-binary=:all:
          --no-cache-dir -r requirements-dev.lock
      - run: python -m pip --isolated --disable-pip-version-check check
      - name: Run the suite, including installed wheel contracts
        run: python -B -m pytest -q -p no:cacheprovider --junitxml "${{ runner.temp }}/m3u-tests-${{ matrix.python-version }}.xml"
      - id: package
        run: python -B tools/package_release.py --output-dir "${{ runner.temp }}/m3u-release-${{ matrix.python-version }}"
      - run: python -B tools/verify_release.py --zip "${{ steps.package.outputs.release_zip }}" --sbom "${{ steps.package.outputs.release_sbom }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3u-enterprise-verified-release-python-${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.release_zip }}
            ${{ steps.package.outputs.release_sbom }}
      - name: Retain the result of each Python version
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3u-enterprise-tests-python-${{ matrix.python-version }}
          path: "${{ runner.temp }}/m3u-tests-${{ matrix.python-version }}.xml"

  attest:
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_protected
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13.17', '3.14.7']
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: m3u-enterprise-verified-release-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/release-pair
          digest-mismatch: error
      - name: Locate the verified pair
        id: pair
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'release-pair'
          $items = @(Get-ChildItem -LiteralPath $dir -Force)
          $zip = @($items | Where-Object Name -Like 'M3U_ENTERPRISE_PRODUCTION_READY_OPTIMIZED_V*.zip')
          $sbom = @($items | Where-Object Name -CEQ 'SBOM.cdx.json')
          if ($items.Count -ne 2 -or $zip.Count -ne 1 -or $sbom.Count -ne 1) { throw 'Expected one release ZIP and its SBOM' }
          foreach ($file in $items) {
            if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Expected regular files' }
          }
          "zip=$($zip[0].FullName)" >> $env:GITHUB_OUTPUT
          "sbom=$($sbom[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pair.outputs.zip }}
      - name: Attest the CycloneDX SBOM for the same ZIP
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pair.outputs.zip }}
          sbom-path: ${{ steps.pair.outputs.sbom }}
      - name: Verify the two bundles from this run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: ${{ steps.pair.outputs.zip }}
          RELEASE_SBOM: ${{ steps.pair.outputs.sbom }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          $identity = @('--repo', $env:GITHUB_REPOSITORY,
                        '--signer-workflow', "$env:GITHUB_REPOSITORY/.github/workflows/ci.yml",
                        '--source-digest', $env:GITHUB_SHA, '--source-ref', $env:GITHUB_REF)
          gh attestation verify $env:RELEASE_ZIP @identity --bundle $env:PROVENANCE_BUNDLE --predicate-type https://slsa.dev/provenance/v1
          if ($LASTEXITCODE -ne 0) { throw 'Build provenance verification failed' }
          $result = gh attestation verify $env:RELEASE_ZIP @identity --bundle $env:SBOM_BUNDLE --predicate-type https://cyclonedx.org/bom --format json
          if ($LASTEXITCODE -ne 0) { throw 'SBOM attestation verification failed' }
          $verified = [System.Text.Json.Nodes.JsonNode]::Parse(($result -join "`n")).AsArray()
          $expected = [System.Text.Json.Nodes.JsonNode]::Parse([IO.File]::ReadAllText($env:RELEASE_SBOM)).AsObject()
          if ($verified.Count -ne 1) { throw 'Expected exactly one verified SBOM statement' }
          $predicate = $verified[0]['verificationResult']['statement']['predicate']
          if (![System.Text.Json.Nodes.JsonNode]::DeepEquals($expected, $predicate)) { throw 'Signed SBOM differs from the distributed file' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $env:RELEASE_ZIP, $env:RELEASE_SBOM | Format-List Hash, Path
